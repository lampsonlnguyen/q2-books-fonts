name: Build and publish font packs
on:
  push:
    branches: [main]
    tags: ['fonts-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install font generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk python3-venv
          python3 -m venv .venv
          .venv/bin/pip install freetype-py fonttools PyYAML
      - name: Fetch and generate fonts
        run: |
          .venv/bin/python tools/fetch_q2_fonts.py build/fonts
          .venv/bin/python tools/build_q2_small_font_assets.py build/fonts
          (cd build/fonts && sha256sum -c books-fonts-8-14.sha256)
      - name: Package individual families
        run: |
          tag=fonts-v1.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          .venv/bin/python tools/package_fonts.py build/fonts dist "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: q2-books-font-packs
          path: dist/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/fonts-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-books-font-packs
          path: dist
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Q2 Books fonts $GITHUB_REF_NAME" --notes "Independent 8–14 pt font packs and catalog. Extract a pack into .books/fonts/ on the SD card."
